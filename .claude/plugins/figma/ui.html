<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Maestro Figma Bridge</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        font-size: 12px;
        padding: 16px;
        color: #0a1a3b;
        background-color: #f8faff;
      }
      .dark {
        color: #fff;
        background-color: #2c2c2c;
      }
      .mcp-plugin__mode {
        position: absolute;
        bottom: -8px;
        right: -4px;
        cursor: pointer;
        transition: ease 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 10px;
        opacity: 0.4;
      }
      .mcp-plugin__mode:hover {
        opacity: 1;
      }
      .mcp-plugin {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 24px;
        height: 100%;
      }
      .mcp-plugin__header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .mcp-plugin__header-title {
        font-size: 14px;
        margin: 0;
      }
      .mcp-plugin__header-description {
        font-size: 12px;
        margin: 0;
      }
      .dark .mcp-plugin__header-description {
        color: #CCCCCC;
      }
      .mcp-plugin__content {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .mcp-plugin__connection-status {
        padding: 8px;
        border-radius: 4px;
        height: 32px;
        line-height: 1.35;
      }
      .mcp-plugin__content-activity {
        display: flex;
      }
      .mcp-plugin__connection-status.connected {
        background: #D8FFBB;
        color: #223005;
      }
      .mcp-plugin__connection-status.disconnected {
        background-color: #FFC8BD;
        color: #280B06;
      }
      .mcp-plugin__connection-status.info {
        background-color: #BBFFFD;
        color: #0B4240;
      }
      .mcp-plugin__channel-name {
        font-weight: bold;
        text-decoration: underline;
        cursor: pointer;
        position: relative;
      }
      .mcp-plugin__channel-name:hover {
        text-decoration: none;
      }
      .mcp-plugin__channel-name::after {
        content: "Click to copy";
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #223005;
        color: #fff;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: normal;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s, visibility 0.2s;
        pointer-events: none;
        z-index: 100;
      }
      .dark .mcp-plugin__channel-name::after {
        background-color: #2c2c2c;
      }
      .mcp-plugin__channel-name:hover::after {
        opacity: 1;
        visibility: visible;
      }
      .mcp-plugin__button {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        width: 96px;
        border: 1px solid #1a56db;
        background-color: #1a56db;
        color: #fff;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        transition: ease 0.2s;
        margin-left: auto;
      }
      .dark .mcp-plugin__button {
        border-color: #3b82f6;
        background-color: #3b82f6;
        color: #ffffff;
      }
      .mcp-plugin__button:hover {
        background-color: transparent;
        color: #1a56db;
      }
      .dark .mcp-plugin__button:hover {
        background-color: transparent;
        color: #ffffff;
        border-color: #3b82f6;
      }
      .mcp-plugin__button--secondary {
        background-color: transparent;
        color: #1a56db;
      }
      .dark .mcp-plugin__button--secondary {
        background-color: transparent;
        color: #fff;
        border-color: #3b82f6;
      }
      .mcp-plugin__button--secondary:hover {
        background-color: #1a56db;
        color: #fff;
      }
      .dark .mcp-plugin__button--secondary:hover {
        background-color: #3b82f6;
        color: #ffffff;
        border-color: #3b82f6;
      }
      .mcp-plugin__button:disabled {
        display: none;
      }
      .hidden {
        display: none !important;
      }
      .mcp-plugin__progress {
        display: flex;
        flex-direction: column;
        width: calc(100% - 112px);
        gap: 4px;
      }
      .mcp-plugin__progress-bar {
        width: 100%;
        height: 4px;
        background-color: #d0dff5;
        border-radius: 4px;
      }
      .dark .mcp-plugin__progress-bar {
        background-color: #575757;
      }
      .mcp-plugin__progress-bar-fill {
        width: 0%;
        height: 4px;
        background-color: #1a56db;
        border-radius: 4px;
        transition: width 0.3s;
      }
      .dark .mcp-plugin__progress-bar-fill {
        background-color: #3b82f6;
      }
      .mcp-plugin__progress-indicators {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 10px;
      }
      .dark .mcp-plugin__progress-indicators {
        color: #ABABAB;
      }
      #progress-status {
        display: none;
      }
      .operation-error {
        color: #f87359ff;
      }
    </style>
  </head>
  <body class="dark">
    <div class="container mcp-plugin">
      <div class="mcp-plugin__mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#0a1a3b" class="mcp-plugin__mode-moon hidden" viewBox="0 -960 960 960"><path d="M483.11-116q-76.3 0-143.05-28.93-66.76-28.93-116.48-78.65t-78.65-116.48Q116-406.81 116-483.11q0-125.27 75.12-223.93 75.11-98.65 198.19-129.65-10.08 96.31 20.34 181.27 30.43 84.96 97.12 151.65 64.69 64.69 151.65 94.62 86.96 29.92 178.27 19.84-29.38 121.08-128.85 197.19Q608.38-116 483.11-116m-.11-52q88 0 164-45t115-122.11q-83-5.01-158.5-39.56T469-468.3q-60-60.08-94-134.89T335-762q-77 41-122 116.18-45 75.19-45 162.82 0 131.25 91.88 223.12Q351.75-168 483-168m-14-300.38"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#fff" class="mcp-plugin__mode-sun" viewBox="0 -960 960 960"><path d="M454-794.31V-902h52v107.69zM454-58v-107.69h52V-58zm340.31-396v-52H902v52zM58-454v-52h107.69v52zm660.31-227.15-37.16-37.16L759-798.38 798.38-759zM202-162.62 162.62-202l79.07-76.85 37.16 37.16zm557 0-77.85-79.07 37.16-37.16L798.38-202zM241.69-681.15 162.62-759 202-798.38l76.85 80.07zm82.54 356.92Q260-388.46 260-480t64.23-155.77T480-700t155.77 64.23T700-480t-64.23 155.77T480-260t-155.77-64.23M599-360.5q49-49.5 49-119.75 0-70.24-48.75-119-48.76-48.75-119-48.75Q410-648 361-599.25q-49 48.76-49 119 0 70.25 48.75 119.75 48.76 49.5 119 49.5Q550-311 599-360.5M481-481"/></svg>
      </div>
      <div class="header mcp-plugin__header">
        <h1 class="mcp-plugin__header-title">🎼 Maestro Figma Bridge</h1>
        <p class="mcp-plugin__header-description">AI orchestration framework ↔ Figma design bridge</p>
      </div>
      <div class="content mcp-plugin__content">
        <div id="connection-status" class="disconnected mcp-plugin__connection-status">
          Disconnected from server…<br>Try to reconnect clicking the button
        </div>
        <div class="mcp-plugin__content-activity">
          <div id="progress-container" class="hidden mcp-plugin__progress">
            <div class="mcp-plugin__progress-bar">
              <div id="progress-bar" class="mcp-plugin__progress-bar-fill"></div>
            </div>
            <div class="mcp-plugin__progress-indicators">
              <div id="progress-status">Not started</div>
              <div id="progress-message" class="mcp-plugin__progress-message">No operation in progress</div>
              <div id="progress-percentage">0%</div>
            </div>
          </div>
          <button id="btn-connect" class="mcp-plugin__button mcp-plugin__button--primary">Connect</button>
          <button id="btn-disconnect" class="mcp-plugin__button mcp-plugin__button--secondary" disabled>Disconnect</button>
        </div>
      </div>
    </div>
    <script>
      /* Maestro Figma Bridge — WebSocket Plugin UI
       * Forked from claude-talk-to-figma-mcp, rebranded for Maestro framework.
       * WebSocket protocol identical — connects to relay at localhost:3055.
       */
      class MaestroBridge {
        constructor() {
          this.state = { connected: false, socket: null, serverPort: 3055, pendingRequests: new Map(), channel: null };
          this.ui = {
            connectBtn: document.getElementById("btn-connect"),
            disconnectBtn: document.getElementById("btn-disconnect"),
            connectionStatus: document.getElementById("connection-status"),
            progressContainer: document.getElementById("progress-container"),
            progressBar: document.getElementById("progress-bar"),
            progressMessage: document.getElementById("progress-message"),
            progressStatus: document.getElementById("progress-status"),
            progressPercentage: document.getElementById("progress-percentage"),
            modeToggle: document.querySelector(".mcp-plugin__mode"),
            modeSun: document.querySelector(".mcp-plugin__mode-sun"),
            modeMoon: document.querySelector(".mcp-plugin__mode-moon"),
          };
          this.init();
        }
        init() {
          this.ui.connectBtn.addEventListener("click", () => this.connect());
          this.ui.disconnectBtn.addEventListener("click", () => this.disconnect());
          this.ui.connectionStatus.addEventListener("click", (e) => {
            if (e.target.classList.contains("mcp-plugin__channel-name")) {
              this.copyToClipboard(e.target.textContent);
            }
          });
          this.ui.modeToggle.addEventListener("click", () => this.toggleMode());
          window.onmessage = (event) => this.handleFigmaMessage(event.data.pluginMessage);
        }
        updateStatus(isConnected, message) {
          this.state.connected = isConnected;
          this.ui.connectionStatus.innerHTML = message || (isConnected ? "Connected to Maestro bridge" : "Not connected to Maestro bridge");
          this.ui.connectionStatus.className = "mcp-plugin__connection-status " + (isConnected ? "connected" : (message && message.includes("Connecting") ? "info" : "disconnected"));
          this.ui.connectBtn.disabled = isConnected;
          this.ui.disconnectBtn.disabled = !isConnected;
        }
        async connect(port = 3055) {
          try {
            if (this.state.connected && this.state.socket) { this.updateStatus(true, "Already connected"); return; }
            this.updateStatus(false, "Connecting...");
            this.ui.connectionStatus.className = "mcp-plugin__connection-status info";
            this.state.serverPort = port;
            this.state.socket = new WebSocket("ws://localhost:" + port);
            this.state.socket.onopen = () => {
              const ch = this.generateChannelName();
              this.state.channel = ch;
              this.state.socket.send(JSON.stringify({ type: "join", channel: ch.trim() }));
            };
            this.state.socket.onmessage = (event) => {
              try {
                const data = JSON.parse(event.data);
                if (data.type === "system") {
                  if (data.message && data.message.result) {
                    this.state.connected = true;
                    const ch = data.channel;
                    this.updateStatus(true, "Connected on port " + port + "!<br>Copy the channel ID: <span class='mcp-plugin__channel-name' title='Click to copy'>" + ch + "</span>");
                    parent.postMessage({ pluginMessage: { type: "notify", message: "🎼 Maestro bridge connected. Channel: " + ch } }, "*");
                  }
                } else if (data.type === "error") {
                  this.updateStatus(false, "Error: " + data.message);
                  this.state.socket.close();
                }
                this.handleSocketMessage(data);
              } catch (e) { console.error("Parse error:", e); }
            };
            this.state.socket.onclose = () => { this.state.connected = false; this.state.socket = null; this.updateStatus(false, "Disconnected from server…<br>Try to reconnect clicking the button"); };
            this.state.socket.onerror = () => { this.updateStatus(false, "Connection error"); this.state.connected = false; this.state.socket = null; };
          } catch (e) { this.updateStatus(false, "Connection error: " + (e.message || "Unknown")); }
        }
        disconnect() {
          if (this.state.socket) {
            this.updateStatus(false, "Disconnecting...");
            this.ui.connectionStatus.className = "mcp-plugin__connection-status info";
            this.state.socket.close();
            this.state.socket = null;
            this.state.connected = false;
          }
        }
        async handleSocketMessage(payload) {
          const data = payload.message;
          if (!data) return;
          if (data.id && this.state.pendingRequests.has(data.id)) {
            const { resolve, reject } = this.state.pendingRequests.get(data.id);
            this.state.pendingRequests.delete(data.id);
            if (data.error) reject(new Error(data.error)); else resolve(data.result);
            return;
          }
          if (data.command) {
            try { parent.postMessage({ pluginMessage: { type: "execute-command", id: data.id, command: data.command, params: data.params } }, "*"); }
            catch (e) { this.sendErrorResponse(data.id, e.message || "Error executing command"); }
          }
        }
        handleFigmaMessage(msg) {
          if (!msg) return;
          switch (msg.type) {
            case "connection-status": this.updateStatus(msg.connected, msg.message); break;
            case "auto-connect": this.connect(); break;
            case "auto-disconnect": this.disconnect(); break;
            case "command-result": this.sendSuccessResponse(msg.id, msg.result); break;
            case "command-error": this.sendErrorResponse(msg.id, msg.error); break;
            case "command_progress": this.updateProgress(msg); this.sendProgressUpdate(msg); break;
          }
        }
        sendSuccessResponse(id, result) {
          if (!this.state.connected || !this.state.socket) return;
          this.state.socket.send(JSON.stringify({ id, type: "message", channel: this.state.channel, message: { id, result } }));
        }
        sendErrorResponse(id, err) {
          if (!this.state.connected || !this.state.socket) return;
          this.state.socket.send(JSON.stringify({ id, type: "message", channel: this.state.channel, message: { id, error: err } }));
        }
        updateProgress(data) {
          this.ui.progressContainer.classList.remove("hidden");
          var p = data.progress || 0;
          this.ui.progressBar.style.width = p + "%";
          this.ui.progressPercentage.textContent = p + "%";
          this.ui.progressMessage.textContent = data.message || "Operation in progress";
          if (data.status === "started" || data.status === "in_progress") {
            this.ui.progressStatus.textContent = data.status === "started" ? "Started" : "In Progress";
            this.ui.progressStatus.className = "";
          } else if (data.status === "completed") {
            this.ui.progressStatus.textContent = "Completed";
            this.ui.progressStatus.className = "operation-complete";
            setTimeout(() => this.ui.progressContainer.classList.add("hidden"), 5000);
          } else if (data.status === "error") {
            this.ui.progressStatus.textContent = "Error";
            this.ui.progressStatus.className = "operation-error";
          }
        }
        sendProgressUpdate(data) {
          if (!this.state.connected || !this.state.socket) return;
          this.state.socket.send(JSON.stringify({ id: data.commandId, type: "progress_update", channel: this.state.channel, message: { id: data.commandId, type: "progress_update", data: data } }));
        }
        async copyToClipboard(text) {
          try {
            if (navigator.clipboard) { await navigator.clipboard.writeText(text); this.notifyCopied(text); }
            else { throw new Error("no clipboard"); }
          } catch (e) {
            var ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
            document.body.appendChild(ta); ta.select();
            if (document.execCommand("copy")) this.notifyCopied(text);
            document.body.removeChild(ta);
          }
        }
        toggleMode() {
          var d = document.body.classList.toggle("dark");
          if (d) { this.ui.modeSun.classList.remove("hidden"); this.ui.modeMoon.classList.add("hidden"); }
          else { this.ui.modeSun.classList.add("hidden"); this.ui.modeMoon.classList.remove("hidden"); }
        }
        notifyCopied(text) { parent.postMessage({ pluginMessage: { type: "notify", message: "Channel copied: " + text } }, "*"); }
        generateChannelName() {
          var c = "abcdefghijklmnopqrstuvwxyz0123456789", r = "";
          for (var i = 0; i < 8; i++) r += c.charAt(Math.floor(Math.random() * c.length));
          return r;
        }
      }
      new MaestroBridge();
    </script>
  </body>
</html>
